<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">

<head>
    <title>Form Peminjaman Buku (Xhtml)</title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <script type="text/javascript">

        function fn_Valform() {
            var sMsg = "";

            if (document.getElementById("nama").value == "") {
                sMsg += " Anda belum Mengisi nama! \n";
            }
            if (document.getElementById("judul").value == "") {
                sMsg += " Anda belum Mengisi judul buku! \n";
            }
            if (document.getElementById("keperluan").value == "") {
                sMsg += " Anda belum Mengisi keperluan! \n";
            }

            if (sMsg != "") {
                alert("Peringatan\n" + sMsg);
                return false;
            }else {
                return true;
            }
        }
    </script>
</head>

<body>
    <h1>Form Peminjaman Buku</h1>
    <form action="#" method="post" onsubmit="return fn_Valform();">
        <p>Nama Peminjam:<br /><input type="text" id="nama" name="nama" /></p>
        <p>Judul Buku:<br /><input type="text" id="judul" name="judul" /></p>
        <p>Keperluan meminjam:<br /><textarea id="keperluan" name="keperluan" rows="4" cols="30"></textarea></p>
        <p><input type="submit" value="Send" /></p>
        </form>
</body>

</html>
